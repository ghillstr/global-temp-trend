<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Temperature Trend 1880–2023</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #60a5fa, #f87171);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      margin-top: 0.5rem;
      color: #8b949e;
      font-size: 0.9rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 900px;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 1.1rem 1.3rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .stat-card .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8b949e;
    }

    .stat-card .value {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .stat-card .sub {
      font-size: 0.78rem;
      color: #8b949e;
    }

    .hot  { color: #f87171; }
    .warm { color: #fb923c; }
    .rise { color: #fbbf24; }

    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .toggle-btn {
      background: #161b22;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .toggle-btn.active, .toggle-btn:hover {
      background: #21262d;
      border-color: #58a6ff;
      color: #58a6ff;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: #8b949e;
    }

    .legend-bar {
      width: 80px;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(to right, #3b82f6, #60a5fa, #a3e635, #fb923c, #f87171);
    }

    .chart-wrapper {
      width: 100%;
      max-width: 900px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 1.5rem;
      position: relative;
    }

    canvas {
      width: 100% !important;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #484f58;
      text-align: center;
    }

    @media (max-width: 480px) {
      .stat-card .value { font-size: 1.3rem; }
      .chart-wrapper { padding: 1rem 0.5rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>Global Temperature Anomaly</h1>
  <p>NASA GISS Land-Ocean Temperature Index &mdash; relative to 1951–1980 baseline</p>
</header>

<div class="stats-grid" id="statsGrid"></div>

<div class="controls">
  <button class="toggle-btn active" id="btnAnnual" onclick="setMode('annual')">Annual Data</button>
  <button class="toggle-btn" id="btnDecade" onclick="setMode('decade')">Decade Average</button>
  <div class="legend">
    <span>Cold</span>
    <div class="legend-bar"></div>
    <span>Warm</span>
  </div>
</div>

<div class="chart-wrapper">
  <canvas id="tempChart"></canvas>
</div>

<footer>
  Data: NASA Goddard Institute for Space Studies (GISS) Surface Temperature Analysis (GISTEMP v4).<br>
  Trend line computed via linear regression.
</footer>

<script>
// ── NASA GISS annual mean anomalies (°C, 1951-1980 baseline) ──
const RAW = {
  1880:-0.16,1881:-0.08,1882:-0.11,1883:-0.17,1884:-0.28,1885:-0.33,1886:-0.31,1887:-0.36,1888:-0.27,1889:-0.17,
  1890:-0.35,1891:-0.22,1892:-0.27,1893:-0.31,1894:-0.32,1895:-0.23,1896:-0.11,1897:-0.11,1898:-0.27,1899:-0.17,
  1900:-0.08,1901:-0.15,1902:-0.28,1903:-0.37,1904:-0.47,1905:-0.26,1906:-0.22,1907:-0.39,1908:-0.43,1909:-0.48,
  1910:-0.43,1911:-0.44,1912:-0.36,1913:-0.35,1914:-0.15,1915:-0.14,1916:-0.36,1917:-0.46,1918:-0.30,1919:-0.27,
  1920:-0.27,1921:-0.19,1922:-0.28,1923:-0.26,1924:-0.27,1925:-0.20,1926:-0.06,1927:-0.19,1928:-0.22,1929:-0.36,
  1930:-0.08,1931:-0.08,1932:-0.10,1933:-0.27,1934:-0.13,1935:-0.19,1936:-0.13,1937:-0.01,1938:-0.01,1939:-0.02,
  1940: 0.10,1941: 0.19,1942: 0.07,1943: 0.09,1944: 0.20,1945: 0.09,1946:-0.07,1947:-0.03,1948:-0.05,1949:-0.08,
  1950:-0.16,1951: 0.01,1952: 0.02,1953: 0.08,1954:-0.13,1955:-0.14,1956:-0.14,1957: 0.05,1958: 0.06,1959: 0.03,
  1960:-0.03,1961: 0.06,1962: 0.03,1963: 0.05,1964:-0.20,1965:-0.11,1966:-0.06,1967:-0.02,1968:-0.07,1969: 0.08,
  1970: 0.04,1971:-0.08,1972: 0.01,1973: 0.16,1974:-0.07,1975:-0.01,1976:-0.10,1977: 0.18,1978: 0.07,1979: 0.16,
  1980: 0.26,1981: 0.32,1982: 0.14,1983: 0.31,1984: 0.16,1985: 0.12,1986: 0.18,1987: 0.32,1988: 0.39,1989: 0.29,
  1990: 0.45,1991: 0.41,1992: 0.22,1993: 0.24,1994: 0.31,1995: 0.45,1996: 0.35,1997: 0.46,1998: 0.63,1999: 0.40,
  2000: 0.42,2001: 0.54,2002: 0.63,2003: 0.62,2004: 0.54,2005: 0.68,2006: 0.61,2007: 0.66,2008: 0.54,2009: 0.64,
  2010: 0.72,2011: 0.61,2012: 0.64,2013: 0.68,2014: 0.75,2015: 0.87,2016: 1.01,2017: 0.92,2018: 0.83,2019: 0.98,
  2020: 1.02,2021: 0.85,2022: 0.89,2023: 1.17
};

const years = Object.keys(RAW).map(Number);
const anomalies = years.map(y => RAW[y]);

// ── Stats ──
const hottestYear = years[anomalies.indexOf(Math.max(...anomalies))];
const hottestVal  = RAW[hottestYear];
const latestYear  = years[years.length - 1];
const latestVal   = RAW[latestYear];
const firstVal    = RAW[years[0]];
const totalWarm   = (latestVal - firstVal).toFixed(2);

function renderStats() {
  const g = document.getElementById('statsGrid');
  const cards = [
    { label: 'Hottest Year on Record', value: hottestYear, sub: `+${hottestVal.toFixed(2)} °C anomaly`, cls: 'hot' },
    { label: 'Latest Anomaly (2023)',  value: `+${latestVal.toFixed(2)} °C`, sub: 'above 1951–1980 baseline', cls: 'warm' },
    { label: 'Total Warming Since 1880', value: `+${totalWarm} °C`, sub: 'net change 1880 → 2023', cls: 'rise' },
    { label: 'Years Analyzed', value: years.length, sub: '1880 – 2023', cls: '' },
  ];
  g.innerHTML = cards.map(c => `
    <div class="stat-card">
      <span class="label">${c.label}</span>
      <span class="value ${c.cls}">${c.value}</span>
      <span class="sub">${c.sub}</span>
    </div>`).join('');
}

// ── Color gradient helpers ──
function anomalyToColor(val) {
  // map roughly -0.5 -> blue, 0 -> green-ish, +1.2 -> red
  const t = Math.max(0, Math.min(1, (val + 0.5) / 1.7));
  if (t < 0.5) {
    const u = t / 0.5;
    const r = Math.round(59  + u * (163 - 59));
    const g = Math.round(130 + u * (230 - 130));
    const b = Math.round(246 - u * (246 - 53));
    return `rgb(${r},${g},${b})`;
  } else {
    const u = (t - 0.5) / 0.5;
    const r = Math.round(163 + u * (248 - 163));
    const g = Math.round(230 - u * (230 - 113));
    const b = Math.round(53  - u * 53);
    return `rgb(${r},${g},${b})`;
  }
}

// ── Linear regression ──
function linReg(xs, ys) {
  const n = xs.length;
  const mx = xs.reduce((a,b) => a+b, 0) / n;
  const my = ys.reduce((a,b) => a+b, 0) / n;
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) { num += (xs[i]-mx)*(ys[i]-my); den += (xs[i]-mx)**2; }
  const slope = num / den;
  const intercept = my - slope * mx;
  return xs.map(x => +(slope * x + intercept).toFixed(4));
}

// ── Decade averages ──
function decadeData() {
  const buckets = {};
  years.forEach(y => {
    const d = Math.floor(y / 10) * 10;
    if (!buckets[d]) buckets[d] = [];
    buckets[d].push(RAW[y]);
  });
  const dYears = Object.keys(buckets).map(Number).sort((a,b)=>a-b);
  const dVals  = dYears.map(d => +(buckets[d].reduce((a,b)=>a+b,0)/buckets[d].length).toFixed(3));
  return { dYears, dVals };
}

// ── Chart ──
let chart;

function buildGradient(ctx, chartArea, vals, xs) {
  const grad = ctx.createLinearGradient(chartArea.left, 0, chartArea.right, 0);
  vals.forEach((v, i) => {
    const stop = i / (vals.length - 1);
    grad.addColorStop(stop, anomalyToColor(v));
  });
  return grad;
}

function buildChart(mode) {
  let labels, data, trendData;
  if (mode === 'annual') {
    labels = years;
    data   = anomalies;
    trendData = linReg(years, anomalies);
  } else {
    const { dYears, dVals } = decadeData();
    labels = dYears;
    data   = dVals;
    trendData = linReg(dYears, dVals);
  }

  if (chart) chart.destroy();

  const ctx = document.getElementById('tempChart').getContext('2d');
  const pointColors = data.map(v => anomalyToColor(v));

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: mode === 'annual' ? 'Annual Anomaly (°C)' : 'Decade Average (°C)',
          data,
          borderColor: function(context) {
            const ch = context.chart;
            const { ctx: c, chartArea } = ch;
            if (!chartArea) return '#60a5fa';
            return buildGradient(c, chartArea, data, labels);
          },
          borderWidth: mode === 'annual' ? 1.8 : 3,
          pointBackgroundColor: pointColors,
          pointBorderColor: pointColors,
          pointRadius: mode === 'annual' ? 2.5 : 6,
          pointHoverRadius: mode === 'annual' ? 5 : 9,
          fill: false,
          tension: 0.3,
          order: 1,
        },
        {
          label: 'Linear Trend',
          data: trendData,
          borderColor: 'rgba(250,204,21,0.75)',
          borderWidth: 2,
          borderDash: [6, 4],
          pointRadius: 0,
          fill: false,
          tension: 0,
          order: 2,
        }
      ]
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          labels: { color: '#8b949e', font: { size: 12 }, boxWidth: 24 }
        },
        tooltip: {
          backgroundColor: '#1c2128',
          borderColor: '#30363d',
          borderWidth: 1,
          titleColor: '#e6edf3',
          bodyColor: '#8b949e',
          callbacks: {
            label: ctx => {
              const v = ctx.parsed.y;
              const sign = v >= 0 ? '+' : '';
              return ` ${ctx.dataset.label}: ${sign}${v.toFixed(3)} °C`;
            }
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#8b949e', maxTicksLimit: 15, font: { size: 11 } },
          grid:  { color: '#21262d' },
          border: { color: '#30363d' }
        },
        y: {
          ticks: {
            color: '#8b949e',
            font: { size: 11 },
            callback: v => (v >= 0 ? '+' : '') + v.toFixed(2) + ' °C'
          },
          grid:  { color: '#21262d' },
          border: { color: '#30363d' },
          title: {
            display: true,
            text: 'Temperature Anomaly (°C)',
            color: '#484f58',
            font: { size: 11 }
          }
        }
      }
    }
  });
}

function setMode(mode) {
  document.getElementById('btnAnnual').classList.toggle('active', mode === 'annual');
  document.getElementById('btnDecade').classList.toggle('active', mode === 'decade');
  buildChart(mode);
}

renderStats();
buildChart('annual');
</script>
</body>
</html>
